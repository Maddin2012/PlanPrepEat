<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rezeptbuch" />
    <title>Rezeptbuch &amp; Essensplan</title>

    <!--
      Muss vor dem ersten Zeichnen laufen, nicht erst wenn React übernimmt:
      sonst leuchtet beim Öffnen für einen Moment die helle Fassung auf.
      Deshalb hier direkt im Kopf und absichtlich nicht als Modul.
      Die Werte spiegeln src/lib/theme.ts — beides muss zusammen geändert werden.
    -->
    <script>
      try {
        if (localStorage.getItem('rezeptbuch.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#1d2125')
        }
      } catch (error) {
        // Kein Speicherzugriff — dann bleibt es hell.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
