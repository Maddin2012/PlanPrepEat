name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  # Erlaubt es, die Veröffentlichung von Hand anzustoßen — praktisch, wenn man
  # gerade erst die Firebase-Secrets eingetragen hat und neu bauen möchte.
  workflow_dispatch:

# Nur ein Durchlauf gleichzeitig; ein neuer Push darf einen laufenden ablösen.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # Vorübergehend, solange die Firebase-Einrichtung hakt: Was kommt beim
      # Bauen tatsächlich an? Ins Protokoll gehen nur Namen und Längen — die
      # Werte werden an Python gereicht, das sie nie ausgibt, und GitHub
      # maskiert Secret-Werte in Logs ohnehin von sich aus.
      #
      # Findet beide üblichen Fehler: Secrets unter einem Environment abgelegt
      # (dieser Job hat keins, also kämen sie leer an) und Tippfehler im Namen.
      - name: Zugangsdaten prüfen
        env:
          ALLE_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'ENDE'
          import json, os

          alle = json.loads(os.environ['ALLE_SECRETS'])
          print('Im Repository hinterlegte Secrets:')
          for name in sorted(alle):
              print(f'  - {name}')

          erwartet = [
              'VITE_FB_API_KEY',
              'VITE_FB_AUTH_DOMAIN',
              'VITE_FB_PROJECT_ID',
              'VITE_FB_APP_ID',
              'VITE_FB_MESSAGING_SENDER_ID',
          ]
          print()
          print('Was davon beim Bauen ankommt:')
          for name in erwartet:
              wert = alle.get(name) or ''
              if wert.strip():
                  print(f'  {name}: gesetzt ({len(wert)} Zeichen)')
              elif wert:
                  print(f'  {name}: NUR LEERZEICHEN ({len(wert)} Zeichen)')
              else:
                  print(f'  {name}: LEER')
          ENDE

      - name: Bauen
        env:
          # Auf GitHub Pages liegt die App unter /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Der Firebase-Web-Schlüssel ist kein Geheimnis (er landet ohnehin im
          # ausgelieferten JavaScript), abgesichert wird über firestore.rules.
          # Trotzdem über Secrets, damit die Werte nicht im Repository stehen.
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_MESSAGING_SENDER_ID: ${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
